[tox]
requires =
    tox>=4.4
env_list =
    py310
    py311
    py312
    py313
    py314
skip_missing_interpreters = true

[testenv]
description = run the complete test suite with {base_python}
package = wheel
wheel_build_env = .pkg
extras =
    test
set_env =
    MPLBACKEND = Agg
    MPLCONFIGDIR = {env_tmp_dir}{/}matplotlib
commands =
    python -m pytest {posargs:-q}
