[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "locus-snap"
version = "0.2.0"
description = "Render IGV-like genomic snapshots from an indexed BAM without opening a genome browser."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "bdolmo" }]
keywords = ["bioinformatics", "genomics", "bam", "igv", "sequencing", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pysam>=0.20",
    "matplotlib>=3.5",
    "PyYAML>=6.0",
    "pyBigWig>=0.3.18",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "tox>=4.4"]

[project.scripts]
locus-snap = "locus_snap.cli:main"

[project.urls]
Homepage = "https://github.com/GENCARDIO/LocusSnap"
Repository = "https://github.com/GENCARDIO/LocusSnap"
Issues = "https://github.com/GENCARDIO/LocusSnap/issues"

[tool.setuptools.packages.find]
include = ["locus_snap*"]

[tool.setuptools.package-data]
locus_snap = ["data/ucsc/*.gz", "data/ucsc/README.md"]
